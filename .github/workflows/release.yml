name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: microsoft/setup-msbuild@v3
      - run: msbuild MusicBee.LrclibLyrics.sln /p:Configuration=Release /p:Platform="Any CPU"
      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path package -Force | Out-Null
          Copy-Item src/MusicBee.LrclibLyrics/bin/Release/MusicBee.LrclibLyrics.dll package/mb_LrclibLyrics.dll
          Copy-Item LICENSE package/LICENSE
          Compress-Archive -Path package/* -DestinationPath "mb_LrclibLyrics-${{ github.ref_name }}.zip" -Force
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: mb_LrclibLyrics-${{ github.ref_name }}.zip